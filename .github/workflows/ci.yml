name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Omarchy validator and shell imports
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: basecamp/omarchy
          ref: 0ae1694830b6bd9511042fe1b89a0062d8c083cb # reviewed quattro snapshot
          path: .omarchy

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck

      - name: Validate clean plugin archive
        run: |
          mkdir "$RUNNER_TEMP/plugin"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/plugin"
          .omarchy/bin/omarchy-plugin-validate "$RUNNER_TEMP/plugin"

      - name: Check shell helpers
        run: shellcheck scripts/build-site.sh scripts/capture-preview scripts/capture-screenshots tests/run_all.sh tests/run_qml_runtime.sh

      - name: Compile and test helpers
        run: |
          python3 -m py_compile p2p-control p2p_*.py scripts/update-screenshot-metadata
          python3 -m unittest discover -s tests -p '*_test.py'

      - name: Run JavaScript contracts
        run: |
          node tests/model.test.js
          node tests/path_utils.test.js
          node tests/contracts.test.js
          node tests/security.test.js
          node tests/release.test.js
          node tests/documentation.test.js
          node tests/site.test.js

      - name: Validate issue forms
        run: ruby scripts/validate-issue-forms.rb

      - name: Inspect release archive
        run: |
          archive_files=$(git archive HEAD | tar -t)
          if grep -E '(^|/)(__pycache__|node_modules|\.pytest_cache)(/|$)|\.py[co]$|\.tar\.gz(\.sha256)?$' <<<"$archive_files"; then
            echo "Release archive contains generated or forbidden files" >&2
            exit 1
          fi
          if git grep -IlE -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}' -- .; then
            echo "Tracked files contain credential-like material" >&2
            exit 1
          fi

      - name: Lint QML
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            archlinux@sha256:4bf33b21a715aac0b48ce6e9eaed4782a898eae96f88f5da3635572129c2584a \
            bash -lc 'pacman -Syu --noconfirm quickshell qt6-declarative >/dev/null && /usr/lib/qt6/bin/qmllint -I .omarchy/shell BarWidget.qml Service.qml P2P*.qml SettingsSurface.qml IntegerSetting.qml Runtime*.qml'
