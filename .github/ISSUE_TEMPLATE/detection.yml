name: Service detection problem
description: Report a missing or incorrectly classified P2P service.
title: "[Detection]: "
labels: [detection]
body:
  - type: input
    id: service
    attributes:
      label: Service
      description: Package, executable, unit, or container image name. Redact private registry hosts.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options: [systemd user unit, systemd system unit, Docker, Podman, process, custom service]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Detection result
      description: Explain what appeared and what should have appeared.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed peer endpoints, credentials, private paths, and unredacted diagnostics.
          required: true
