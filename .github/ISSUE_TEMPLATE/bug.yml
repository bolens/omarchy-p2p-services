name: Bug report
description: Report incorrect plugin behavior.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include private endpoints, paths, usernames, credentials, or unredacted diagnostics.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include the plugin and Omarchy versions.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Service backend
      options:
        - systemd user unit
        - systemd system unit
        - Docker
        - Podman
        - process discovery
        - custom service
        - unknown or not applicable
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I removed private data and secrets from this report.
          required: true
        - label: I searched existing issues for this problem.
          required: true
